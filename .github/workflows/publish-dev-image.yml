name: Publish development image

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghcr-development-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'mkronvold-wtg/content-viewer' &&
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish development image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mkronvold-wtg/content-viewer:dev
            ghcr.io/mkronvold-wtg/content-viewer:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
