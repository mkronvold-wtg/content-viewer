name: Publish development image

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghcr-development-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'mkronvold-wtg/content-viewer' &&
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mkronvold-wtg/content-viewer:dev
            ghcr.io/mkronvold-wtg/content-viewer:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
