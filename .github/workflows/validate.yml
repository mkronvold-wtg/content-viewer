name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Cache npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-downloads-${{ runner.os }}-${{ runner.arch }}-node-26-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-downloads-${{ runner.os }}-${{ runner.arch }}-node-26-
      - name: Install dependencies
        run: npm ci
      - name: Build and syntax-check
        run: npm run build
      - name: Run deterministic Node test suite
        run: npm test
      - name: Build final image
        run: docker build --tag content-viewer:ci-${{ github.sha }} .
      - name: Smoke-test final image
        env:
          CONTENT_VIEWER_TEST_IMAGE: content-viewer:ci-${{ github.sha }}
        run: npm run test:container
