name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and syntax-check
        run: npm run build
      - name: Run deterministic Node test suite
        run: npm test
      - name: Build final image
        run: docker build --tag content-viewer:ci-${{ github.sha }} .
      - name: Smoke-test final image
        env:
          CONTENT_VIEWER_TEST_IMAGE: content-viewer:ci-${{ github.sha }}
        run: npm run test:container
