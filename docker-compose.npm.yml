services:
  content-viewer:
    image: "${CONTENT_VIEWER_IMAGE:?CONTENT_VIEWER_IMAGE must be set}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      CONTENT_VIEWER_REPO_PATH: "${CONTENT_VIEWER_REPO_PATH:-/app/content}"
    expose:
      - "8080"
    volumes:
      - content-viewer-content:/app/content
    networks:
      content-viewer-egress:
      proxy-net:
        aliases:
          - content-viewer

volumes:
  content-viewer-content:

networks:
  content-viewer-egress:
  # The external proxy network differs per Dockerhost; set
  # CONTENT_VIEWER_PROXY_NETWORK in the deployment .env (for example
  # npm-proxy). The default keeps the existing target.
  proxy-net:
    external: true
    name: "${CONTENT_VIEWER_PROXY_NETWORK:-nginxproxy_proxy-net}"
